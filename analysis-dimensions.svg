<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#012"/><stop offset="1" stop-color="#023"/></linearGradient>
    <style>
      .bg{fill:url(#bg)}
      .title{font: bold 34px sans-serif; fill:#cfe;}
      .card{fill:rgba(255,255,255,0.03); stroke:#3af; stroke-width:2}
      .heading{font: 18px sans-serif; fill:#9ff}
      .text{font:14px sans-serif; fill:#bde}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <text x="50%" y="40" text-anchor="middle" class="title">Five AI Analysis Dimensions</text>

  <!-- 1 -->
  <rect x="30" y="70" rx="12" ry="12" width="260" height="220" class="card"/>
  <text x="160" y="110" text-anchor="middle" class="heading">1. Market Research</text>
  <text x="160" y="140" text-anchor="middle" class="text">Market size, trends, demand, customers</text>

  <!-- 2 -->
  <rect x="320" y="70" rx="12" ry="12" width="260" height="220" class="card"/>
  <text x="450" y="110" text-anchor="middle" class="heading">2. Competitor Analysis</text>
  <text x="450" y="140" text-anchor="middle" class="text">Competitors, gaps, differentiation</text>

  <!-- 3 -->
  <rect x="610" y="70" rx="12" ry="12" width="260" height="220" class="card"/>
  <text x="740" y="110" text-anchor="middle" class="heading">3. Financial Planning</text>
  <text x="740" y="140" text-anchor="middle" class="text">Costs, revenue, break-even</text>

  <!-- 4 -->
  <rect x="900" y="70" rx="12" ry="12" width="260" height="220" class="card"/>
  <text x="1030" y="110" text-anchor="middle" class="heading">4. Risk Analysis</text>
  <text x="1030" y="140" text-anchor="middle" class="text">Risks, mitigation, compliance</text>

  <!-- 5 -->
  <rect x="1190" y="70" rx="12" ry="12" width="260" height="220" class="card"/>
  <text x="1320" y="110" text-anchor="middle" class="heading">5. Marketing Strategy</text>
  <text x="1320" y="140" text-anchor="middle" class="text">Positioning, channels, growth</text>

</svg>
